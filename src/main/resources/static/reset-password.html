<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="main-container">

    <div class="left-section">

        <div class="brand">

            <div class="logo">C</div>

            <h1>CLIMENTOS</h1>

        </div>

        <div class="left-content">

            <h2>Welcome to</h2>

            <h2 class="highlight">
                Climentos Technologies
            </h2>

            <p>Innovation. Technology. Growth.</p>

        </div>

        <!-- TECHNOLOGY ILLUSTRATION -->

        <div class="technology-image">

            <div class="tech-orbit orbit-one"></div>
            <div class="tech-orbit orbit-two"></div>

            <!-- Floating Technology Icons -->

            <div class="tech-icon html-icon">&lt;/&gt;</div>

            <div class="tech-icon cloud-icon">☁</div>

            <div class="tech-icon java-icon">☕</div>

            <div class="tech-icon gear-icon">⚙</div>

            <div class="tech-icon database-icon">▤</div>

            <!-- Laptop -->

            <div class="laptop">

                <div class="laptop-screen">

                    <div class="screen-top">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="coding">

                        <p><span class="purple">class</span> Climentos {</p>

                        <p>&nbsp;&nbsp;<span class="blue">String</span> future =</p>

                        <p>&nbsp;&nbsp;<span class="green">"Innovation";</span></p>

                        <p>&nbsp;&nbsp;<span class="purple">void</span> create() {</p>

                        <p>&nbsp;&nbsp;&nbsp;&nbsp;BuildTechnology();</p>

                        <p>&nbsp;&nbsp;}</p>

                        <p>}</p>

                    </div>

                </div>

                <div class="laptop-base"></div>

            </div>

            <div class="tech-glow"></div>

        </div>

    </div>


    <div class="right-section">

        <div class="form-container">

            <h1>Welcome to Climentos</h1>

            <h2>Reset Your Password</h2>

            <input
                    type="password"
                    id="newPassword"
                    placeholder="New Password">

            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password">

            <button onclick="updatePassword()">
                Update Password
            </button>

            <p id="resetMessage"></p>

            <a href="login.html" class="back-to-login">
                Back to Login
            </a>

        </div>

    </div>

</div>


<script>

    async function updatePassword() {

        const password =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("resetMessage");

        const token =
            new URLSearchParams(window.location.search)
                .get("token");

        if (!token) {

            message.innerText = "Invalid reset link";

            return;
        }

        if (!password || !confirmPassword) {

            message.innerText = "Please fill all fields";

            return;
        }

        if (password.length < 8) {

            message.innerText =
                "Password must contain at least 8 characters";

            return;
        }

        if (password !== confirmPassword) {

            message.innerText =
                "Passwords do not match";

            return;
        }

        try {

            const response = await fetch(
                "/api/auth/reset-password",
                {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        token: token,
                        password: password
                    })

                }
            );

            const result = await response.json();

            if (!response.ok) {

                throw new Error(
                    result.message || "Password reset failed"
                );

            }

            message.style.color = "green";

            message.innerText =
                "Password updated successfully";

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

            setTimeout(() => {

                window.location.href = "login.html";

            }, 2000);

        }

        catch(error) {

            message.style.color = "red";

            message.innerText = error.message;

        }

    }

</script>

</body>
</html>
